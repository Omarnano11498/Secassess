<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="secassess — scope-enforced defensive security assessment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b2233"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset="1" stop-color="#3fb950" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#7ee787"/><stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="0.6"/></pattern>
    <clipPath id="radar"><circle cx="226" cy="170" r="120"/></clipPath>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity="0.5"/>
  <g fill="none" stroke="#2ea043" stroke-opacity="0.55">
    <circle cx="226" cy="170" r="120" stroke-width="2"/><circle cx="226" cy="170" r="80"/><circle cx="226" cy="170" r="40"/>
    <path d="M106 170H346M226 50V290" stroke-opacity="0.3"/>
  </g>
  <g clip-path="url(#radar)">
    <path d="M226 170 L346 170 A120 120 0 0 0 311 85 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0 226 170" to="360 226 170" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(236 128)">
      <circle r="4" fill="#3fb950"><animate attributeName="opacity" values="0;1;0.25;0" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="none" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="r" values="4;16" dur="4s" begin="0.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle></g>
<g transform="translate(300 210)">
      <circle r="4" fill="#3fb950"><animate attributeName="opacity" values="0;1;0.25;0" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="none" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="r" values="4;16" dur="4s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle></g>
<g transform="translate(180 236)">
      <circle r="4" fill="#3fb950"><animate attributeName="opacity" values="0;1;0.25;0" dur="4s" begin="2.3s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="none" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="r" values="4;16" dur="4s" begin="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="4s" begin="2.3s" repeatCount="indefinite"/></circle></g>
<g transform="translate(268 92)">
      <circle r="4" fill="#3fb950"><animate attributeName="opacity" values="0;1;0.25;0" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="none" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="r" values="4;16" dur="4s" begin="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle></g>
<g transform="translate(150 160)">
      <circle r="4" fill="#3fb950"><animate attributeName="opacity" values="0;1;0.25;0" dur="4s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="none" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="r" values="4;16" dur="4s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="4s" begin="1.7s" repeatCount="indefinite"/></circle></g>
  <circle cx="226" cy="170" r="5" fill="#7ee787"/>
  <text x="470" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#title)">secassess</text>
  <text x="472" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#c9d1d9">Scope-enforced defensive security assessment</text>
  <text x="470" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#7ee787" opacity="0">&gt; Scope-enforced network inventory with Nmap<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.2300;0.2500;1" dur="16s" repeatCount="indefinite"/></text><text x="470" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#7ee787" opacity="0">&gt; Risk analysis from observed services &amp; local advisories<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2700;0.4800;0.5000;1" dur="16s" repeatCount="indefinite"/></text><text x="470" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#7ee787" opacity="0">&gt; Read-only static review of software projects<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5200;0.7300;0.7500;1" dur="16s" repeatCount="indefinite"/></text><text x="470" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#7ee787" opacity="0">&gt; Local, read-only hardware-health indicators<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7700;0.9800;1.0000;1" dur="16s" repeatCount="indefinite"/></text>
  <rect x="472" y="270" width="236" height="32" rx="16" fill="#1f6feb" fill-opacity="0.18" stroke="#1f6feb"/>
  <text x="590" y="291" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#79c0ff">dry-run by default</text>
  <rect x="722" y="270" width="250" height="32" rx="16" fill="#da3633" fill-opacity="0.15" stroke="#da3633"/>
  <text x="847" y="291" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#ff7b72">authorized targets only</text>
  <circle cx="990" cy="286" r="6" fill="#3fb950"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="1004" y="291" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8b949e">no NSE · no exploits</text>
</svg>